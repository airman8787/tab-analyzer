name: verification

# DSP の回帰検証（verification/）を push / PR のたびに自動実行する。
# 各スクリプトは合否を終了コードで返す（compare-reference は差分の表示のみなので参考扱い）。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: EBU Tech 3341/3342 (synthetic)
        run: node verification/ebu-synthetic.js
      - name: True peak (sine)
        run: node verification/truepeak-sine.js
      - name: Diagnostics checks
        run: node verification/diagnostics-checks.js
      - name: NVH / sound level / psychoacoustics checks
        run: node verification/nvh-checks.js
      - name: Edit / separation / pitch checks
        run: node verification/edit-checks.js
      - name: Score / beat / chord / TAB checks
        run: node verification/score-checks.js
      - name: Compare with reference implementation (informational)
        run: node verification/compare-reference.js
        continue-on-error: true
